name: Publish SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publishing)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      version_override:
        description: "Override version (e.g. 1.2.3). Leave empty to use release tag."
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "stable"

jobs:
  # ── Generate SDKs ──────────────────────────────────────────────
  generate:
    name: Generate SDKs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            echo "version=${{ inputs.version_override }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            # Strip leading 'v' if present
            TAG="${{ github.event.release.tag_name }}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SDKs
        run: npx tsx scripts/generate-sdks.ts --version=${{ steps.version.outputs.version }}

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdks
          path: sdks/
          retention-days: 1

  # ── Publish to npm ─────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: generate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdks/

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Publish @conch/sdk
        working-directory: sdks/typescript
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @conch/sdk@${{ needs.generate.outputs.version }}"
            npm pack --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Publish to PyPI ────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: generate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdks/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        working-directory: sdks/python
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: inputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          # Uses trusted publishing (OIDC) — no token needed
          # Configure at https://pypi.org/manage/project/conch-sdk/settings/publishing/

      - name: Dry run
        if: inputs.dry_run == 'true'
        working-directory: sdks/python
        run: |
          echo "DRY RUN: Would publish conch-sdk to PyPI"
          ls -la dist/

  # ── Publish to crates.io ───────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: generate
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdks/

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: sdks/rust
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish conch-sdk to crates.io"
            cargo publish --dry-run
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  # ── Notify ─────────────────────────────────────────────────────
  notify:
    name: Publish Summary
    needs: [generate, publish-npm, publish-pypi, publish-crates]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## SDK Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ needs.generate.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dry Run:** ${{ inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| npm | ${{ needs.publish-npm.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PyPI | ${{ needs.publish-pypi.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| crates.io | ${{ needs.publish-crates.result }} |" >> "$GITHUB_STEP_SUMMARY"
